<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DreamShot vs Renix AI – Báo cáo quảng cáo US</title>
<style>
:root{
  --bg:#f6f7f9;--card:#fff;--ink:#14181f;--ink2:#4a5261;--muted:#7b8494;--line:#e3e6ec;--soft:#f0f2f6;
  --dream:#2f6fdf;--dream-soft:#9db9ec;--renix:#e07b39;--good:#1f9d62;--bad:#c9403a;--warn:#b7791f;
  --accent:#14181f;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1218;--card:#181c24;--ink:#eef0f4;--ink2:#b4bbc8;--muted:#8a93a3;--line:#2a303b;--soft:#1f242d;
  --dream:#5b93f5;--dream-soft:#3d5f9e;--renix:#f09a5c;--good:#3ecb8a;--bad:#ef7770;--warn:#e2b04f;--accent:#eef0f4}}
:root[data-theme="dark"]{
  --bg:#0f1218;--card:#181c24;--ink:#eef0f4;--ink2:#b4bbc8;--muted:#8a93a3;--line:#2a303b;--soft:#1f242d;
  --dream:#5b93f5;--dream-soft:#3d5f9e;--renix:#f09a5c;--good:#3ecb8a;--bad:#ef7770;--warn:#e2b04f;--accent:#eef0f4}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px 80px}
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top .in{max-width:1180px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:700;font-size:16px}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.sp{flex:1}
.switch{display:inline-flex;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:3px}
.switch button{border:0;background:transparent;color:var(--ink2);padding:7px 18px;border-radius:999px;font:inherit;font-weight:600;cursor:pointer}
.switch button.on{background:var(--accent);color:var(--bg)}
.iconbtn{border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:8px;padding:6px 10px;cursor:pointer;font:inherit}
nav.toc{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 6px}
nav.toc a{font-size:12.5px;color:var(--ink2);text-decoration:none;background:var(--card);border:1px solid var(--line);padding:4px 11px;border-radius:999px}
nav.toc a:hover{border-color:var(--ink2)}
h1{font-size:30px;line-height:1.2;margin:26px 0 6px}
h2{font-size:22px;margin:0 0 4px}
.sub{color:var(--ink2);margin:0 0 14px}
section.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px 26px;margin:18px 0;scroll-margin-top:70px}
.kicker{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:4px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink2);margin:6px 0 12px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.dream{color:var(--dream)}.renix{color:var(--renix)}
.bgD{background:var(--dream)}.bgR{background:var(--renix)}.bgDs{background:var(--dream-soft)}
.tldr{border-left:4px solid var(--accent);background:var(--soft);padding:16px 20px;border-radius:0 12px 12px 0;margin:16px 0}
.tldr ol{margin:8px 0 0 18px;padding:0}.tldr li{margin:6px 0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.kpi{background:var(--soft);border-radius:12px;padding:14px 16px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.kpi .v{display:flex;gap:14px;align-items:baseline;margin-top:6px;flex-wrap:wrap}
.kpi .v b{font-size:24px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12.5px;color:var(--ink2);margin-top:4px}
.pos{color:var(--good);font-weight:600}.neg{color:var(--bad);font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:22px}
@media(max-width:820px){.grid2{grid-template-columns:1fr}section.card{padding:18px}}
.bars .row{display:grid;grid-template-columns:190px 1fr;gap:12px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.bars .row:first-child{border-top:0}
.bars .lab{font-size:13px;color:var(--ink2);word-break:break-word}
.bars .lab small{display:block;color:var(--muted);font-size:11px}
.bars .b{display:flex;align-items:center;gap:8px;margin:2px 0}
.bars .b .bar{height:14px;border-radius:0 4px 4px 0;min-width:2px}
.bars .b span{font-size:12px;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.bars .b em{font-style:normal;color:var(--muted);font-size:11px}
@media(max-width:600px){.bars .row{grid-template-columns:1fr}}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child,td.l,th.l{text-align:left}
th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em;background:var(--card);position:sticky;top:0;cursor:pointer;user-select:none}
th.nosort{cursor:default}
td.wrap,th.wrap{white-space:normal}
tr:hover td{background:var(--soft)}
.tablewrap{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:10px}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--ink2)}
.tag.ok{color:var(--good);border-color:var(--good)}.tag.hyp{color:var(--warn);border-color:var(--warn)}.tag.no{color:var(--bad);border-color:var(--bad)}
.diff{display:grid;gap:10px}
.diff .it{display:grid;grid-template-columns:34px 1fr auto;gap:12px;padding:12px 14px;background:var(--soft);border-radius:10px;align-items:start}
.diff .n{font-weight:700;color:var(--muted);font-size:18px}
.diff p{margin:2px 0 0;color:var(--ink2);font-size:14px}
.note{font-size:12.5px;color:var(--muted);margin-top:10px}
.callout{border:1px solid var(--warn);background:color-mix(in srgb,var(--warn) 10%,transparent);border-radius:10px;padding:12px 16px;margin:12px 0;font-size:14px}
.big{font-size:44px;font-weight:800;line-height:1}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.filters select,.filters input{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 4px}
.subtabs button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:8px;padding:6px 14px;cursor:pointer;font-weight:600}
.subtabs button.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}
#tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 10px;border-radius:8px;font-size:12px;z-index:50;display:none;max-width:280px}
ul.clean{margin:6px 0 0 18px;padding:0}ul.clean li{margin:5px 0}
.view{display:none}.view.on{display:block}
.mix td,.mix th{font-size:13.5px}
@media print{header.top,nav.toc{display:none}.view{display:block!important}}
</style>
</head>
<body>
<header class="top"><div class="in">
  <div class="brand">DreamShot vs Renix AI<small>Quảng cáo · thị trường US · nguồn: renix-dream-us-23-25.csv</small></div>
  <div class="sp"></div>
  <div class="switch" role="tablist">
    <button id="bR" class="on" onclick="go('report')">📊 Báo cáo</button>
    <button id="bD" onclick="go('data')">🗂 Dữ liệu</button>
  </div>
  <button class="iconbtn" onclick="toggleTheme()" title="Đổi sáng/tối">◐</button>
</div></header>

<div class="wrap">
<!-- ======================= REPORT ======================= -->
<div id="report" class="view on"></div>
<!-- ======================= DATA ======================= -->
<div id="data" class="view">

  <div class="subtabs" id="subtabs"></div>
  <div class="filters" id="filters"></div>
  <div class="tablewrap"><table id="dt"></table></div>
  <p class="note" id="dtnote"></p>
</div>
</div>
<div id="tip"></div>

  <section class="card" id="s11">

      <li><b>Cấu hình mediation</b>: danh sách instance & floor của Waterfall Dream, floor/ eCPM floor các instance bidding, thứ tự ưu tiên ở cả hai app.</li>

function allMetricsHTML(){
  const A=a=>{const rs=of(a),b=rs.filter(x=>x.bidreq>0),
    bidreq=sum(b.map(x=>x.bidreq)),inA=sum(b.map(x=>x.bidreq*x.inauc/100)),wins=sum(b.map(x=>x.bidreq*x.inauc/100*x.win/100)),
    lr=rs.filter(x=>x.lat>0&&x.req>0),lat=sum(lr.map(x=>x.lat*x.req))/sum(lr.map(x=>x.req));
    const fm=f=>agg(rs.filter(x=>x.fmt===f)).earn/T[a].earn*100;
    return {bidreq,inauc:bidreq?inA/bidreq*100:0,win:inA?wins/inA*100:0,lat,
      fI:fm('Interstitial'),fN:fm('Native'),fB:fm('Banner'),fR:fm('Rewarded'),
      nU:new Set(rs.filter(x=>x.imp>0).map(x=>x.unit)).size,nS:new Set(rs.filter(x=>x.earn>0).map(x=>x.src)).size,
      ctr:T[a].imp?T[a].clk/T[a].imp*100:0}};
  const X={Dream:A('Dream'),Renix:A('Renix')};
  const g=(t,a)=>[t,[a]];
  // [nhãn, hàm(app), số lẻ, hướng: 1 cao hơn tốt, -1 thấp hơn tốt, 0 trung tính]
  const G=[
   ['Doanh thu & giá',[
    ['Doanh thu ước tính ($)',a=>T[a].earn,0,1],['Impressions',a=>T[a].imp,0,1],['eCPM tổng ($)',a=>T[a].ecpm,1,1],['eCPM bỏ Waterfall ($)',a=>TX[a].ecpm,1,1],
    ['Clicks',a=>T[a].clk,0,0],['CTR (%)',a=>X[a].ctr,2,0]]],

   ['Đấu giá (bidding)',[
    ['Bid requests',a=>X[a].bidreq,0,0],['Bids in auction (%)',a=>X[a].inauc,1,1],['Win rate (%)',a=>X[a].win,1,1]]],
   ['Cơ cấu doanh thu',[
    ['% doanh thu Interstitial',a=>X[a].fI,1,0],['% doanh thu Native',a=>X[a].fN,1,0],['% doanh thu Banner',a=>X[a].fB,1,0],['% doanh thu Rewarded',a=>X[a].fR,1,0],
    ['% doanh thu ad first open (sdk_*)',a=>FO[a].earn/T[a].earn*100,1,0],['Số ad unit có impression',a=>X[a].nU,0,0],['Số nguồn có doanh thu',a=>X[a].nS,0,0]]],
   ['Doanh thu trên user',[
    ['DAU cộng 3 ngày',a=>AU[a],0,1],['User mới 3 ngày',a=>NEWU[a],0,1],['Doanh thu / user-ngày ($)',a=>T[a].earn/AU[a],2,1],['Imp / user-ngày',a=>T[a].imp/AU[a],1,1],['Request / user-ngày',a=>T[a].req/AU[a],0,0],['LTV D0 ($)',a=>Q[a].ltv0,2,1]]],
   ['Giữ chân & hành vi',[
    ['R1 (%)',a=>Q[a].r1,2,1],['Session / user',a=>Q[a].sess,2,1],['Dùng app không-ads (giây)',a=>Q[a].nonad,0,1],['Xem ads toàn màn / user (giây)',a=>Q[a].fsad,1,-1],['% DAU là user quay lại',a=>Q[a].retPct,1,1],['Home rate (%)',a=>Q[a].home,1,1],['Tỉ lệ first open (%)',a=>Q[a].fo,1,1]]],
   ['Mua user (UA)',[
    ['Chi phí UA 3 ngày ($)',a=>Q[a].cost,0,0],['CPI ($)',a=>Q[a].cpi,2,-1],['Chi phí / cohort user ($)',a=>Q[a].cpu,2,-1],['Doanh thu cohort đến nay ($)',a=>Q[a].rev,0,1],['ROAS D0 (%)',a=>Q[a].roas0,1,1],['ROAS D1 (%)',a=>Q[a].roas1,1,1]]]];
  const rows=G.map(([title,items])=>`<tr><td class="l" colspan="5" style="background:var(--soft);font-weight:700">${title}</td></tr>`+items.map(([l,fn,dp,dir])=>{
    const a=fn('Dream'),b=fn('Renix');const ratio=b?a/b:0;
    let who='<span class="tag">—</span>';
    if(dir&&a!==b){const dw=(dir>0)===(a>b);who=`<span class="tag ${dw?'':'hyp'}" style="${dw?'color:var(--dream);border-color:var(--dream)':'color:var(--renix);border-color:var(--renix)'}">${dw?'Dream':'Renix'}</span>`}
    return `<tr><td class="l">${l}</td><td>${nf(a,dp)}</td><td>${nf(b,dp)}</td><td>${b?nf(ratio,2)+'×':'—'}</td><td>${who}</td></tr>`}).join('')).join('');
  const wins={Dream:0,Renix:0};
  G.forEach(([,items])=>items.forEach(([,fn,,dir])=>{if(dir){const a=fn('Dream'),b=fn('Renix');if(a!==b)wins[(dir>0)===(a>b)?'Dream':'Renix']++}}));
  return `<section class="card" id="s8b"><div class="kicker">Toàn bộ chỉ số</div><h2>Bảng so sánh tất cả chỉ số</h2>
    <p class="sub">Cột “Tốt hơn” chỉ tính các chỉ số có hướng rõ ràng (cao hơn tốt, hoặc thấp hơn tốt như CPI, latency); chỉ số quy mô/cơ cấu để trung tính (—). Tính trên các chỉ số có hướng: Dream thắng <b class="dream">${wins.Dream}</b>, Renix thắng <b class="renix">${wins.Renix}</b>.</p>
    <div class="tablewrap" style="max-height:none"><table><tr><th class="l nosort">Chỉ số</th><th class="nosort"><span class="dream">DreamShot</span></th><th class="nosort"><span class="renix">Renix AI</span></th><th class="nosort">Dream / Renix</th><th class="nosort">Tốt hơn</th></tr>${rows}</table></div>
    <p class="note">Latency TB tính theo trọng số request; Bids in auction và Win rate tính theo trọng số bid request của các nguồn bidding. Chỉ số theo user dùng DAU thật (xem mục User & first open).</p></section>`}

// ---------- DATA TAB ----------
let view='unit',sortK=null,sortDir=-1;
const F={app:'',fmt:'',q:'',src:''};
const subs=[['summary','Tổng quan 2 app'],['unit','Theo ad unit'],['src','Theo nguồn'],['users','User theo ngày'],['roas','ROAS cohort'],['home','Home rate'],['raw','Dòng gốc ad']];
function setView(v){view=v;sortK=null;renderData()}
function renderData(){
  $('#subtabs').innerHTML=subs.map(([k,l])=>`<button class="${view===k?'on':''}" onclick="setView('${k}')">${l}</button>`).join('');
  const fmts=[...new Set(ROWS.map(r=>r.fmt))], srcs=[...new Set(ROWS.map(r=>r.src))];
  let f='';
  if(['unit','src','raw'].includes(view)){
    f+=`<input id="fq" placeholder="Tìm ad unit…" value="${F.q}" oninput="F.q=this.value;renderTable()">`;
    f+=`<select onchange="F.fmt=this.value;renderTable()"><option value="">Mọi format</option>${fmts.map(x=>`<option ${F.fmt===x?'selected':''}>${x}</option>`).join('')}</select>`;
    if(view==='raw'||view==='src'){f+=`<select onchange="F.app=this.value;renderTable()"><option value="">Cả 2 app</option>${['Dream','Renix'].map(x=>`<option ${F.app===x?'selected':''}>${x}</option>`).join('')}</select>`}
    if(view==='raw'){f+=`<select onchange="F.src=this.value;renderTable()"><option value="">Mọi nguồn</option>${srcs.map(x=>`<option ${F.src===x?'selected':''}>${x}</option>`).join('')}</select>`}
  }
  $('#filters').innerHTML=f;
  renderTable();
}
function td(v,c=''){return `<td class="${c}">${v}</td>`}
function renderTable(){
  let cols,rows,note='';
  const q=F.q.toLowerCase();
  const pass=r=>(!F.app||r.app===F.app)&&(!F.fmt||r.fmt===F.fmt)&&(!F.src||r.src===F.src)&&(!q||r.unit.toLowerCase().includes(q));
  if(view==='users'||view==='roas'||view==='home'){
    let h,body='';
    if(view==='users'){h=['App','Ngày','DAU','User mới','% DAU quay lại','Session/user','Dùng app không-ads (s)','Ads toàn màn/user (s)'];
      ['Dream','Renix'].forEach(a=>DAYS.forEach((dy,i)=>{const u=USERS[a];body+=`<tr><td class="l">${a}</td><td class="l">${dy}</td><td>${u.dau[i]}</td><td>${u.nw[i]}</td><td>${nf(u.ret[i],2)}</td><td>${nf(u.sess[i],2)}</td><td>${u.nonad[i]} (${mmss(u.nonad[i])})</td><td>${nf(u.fsad[i],2)}</td></tr>`}));
      note='Nguồn: biểu đồ Active Users, Session/AU, Non-ad time, Full-screen ad time trong file docx.'}
    if(view==='roas'){h=['App','Ngày first open','Cohort users','Install','Cohort rev $','Cost $','CPI','CPU','R1 %','LTV D0','LTV D3','ROAS D0 %','ROAS D1 %','ROAS D3 %'];
      ['Dream','Renix'].forEach(a=>ROAS[a].forEach((x,i)=>{body+=`<tr><td class="l">${a}</td><td class="l">${DAYS[i]}</td><td>${x.cu}</td><td>${x.ins}</td><td>${nf(x.rev,2)}</td><td>${nf(x.cost,2)}</td><td>${nf(x.cpi,4)}</td><td>${nf(x.cpu,4)}</td><td>${nf(x.r1,2)}</td><td>${nf(x.l0,4)}</td><td>${x.l3==null?'—':nf(x.l3,4)}</td><td>${nf(x.r0,2)}</td><td>${nf(x.r1d,2)}</td><td>${x.r3==null?'—':nf(x.r3,2)}</td></tr>`}));
      note='Nguồn: bảng “Roas All By Date” (ngày = First Open Time).'}
    if(view==='home'){h=['App','Phiên bản','Ngày cài','First open','Home rate %','Trong kỳ 23–25?'];
      ['Dream','Renix'].forEach(a=>HOME[a].rows.forEach(([dy,fo,hr])=>{body+=`<tr><td class="l">${a}</td><td class="l">${HOME[a].ver}</td><td class="l">${dy}</td><td>${fo}</td><td>${hr}</td><td class="l">${dy==='26/10'?'Không (ngoài kỳ)':'Có'}</td></tr>`}));
      note='Nguồn: bảng “Home rate by install day”, United States.'}
    $('#dt').innerHTML='<tr>'+h.map((x,i)=>`<th class="nosort ${i<2?'l':''}">${x}</th>`).join('')+'</tr>'+body;$('#dtnote').textContent=note;return;
  }
  if(view==='summary'){
    const m=[['Doanh thu ($)',a=>T[a].earn,v=>nf(v,1)],['Impressions',a=>T[a].imp,nf],['eCPM tổng ($)',a=>T[a].ecpm,v=>nf(v,2)],['eCPM bỏ Waterfall ($)',a=>TX[a].ecpm,v=>nf(v,2)],['Doanh thu Waterfall ($)',a=>a==='Dream'?WF.earn:0,v=>nf(v,1)],['Requests',a=>T[a].req,nf],['Matched requests',a=>T[a].mreq,nf],['Match rate (%)',a=>T[a].match,v=>nf(v,2)],['Imp / request (%)',a=>T[a].fill,v=>nf(v,2)],['Clicks',a=>T[a].clk,nf],['Active users CSV (không dùng)',a=>AUcsv[a],nf],['DAU cộng 3 ngày',a=>AU[a],nf],['User mới 3 ngày',a=>NEWU[a],nf],['Doanh thu / user-ngày ($)',a=>T[a].earn/AU[a],v=>nf(v,3)],['Imp / user-ngày',a=>T[a].imp/AU[a],v=>nf(v,2)],['Request / user-ngày',a=>T[a].req/AU[a],v=>nf(v,1)],['LTV D0 ($)',a=>Q[a].ltv0,v=>nf(v,3)],['R1 (%)',a=>Q[a].r1,v=>nf(v,2)],['Session / user',a=>Q[a].sess,v=>nf(v,2)],['ROAS D0 (%)',a=>Q[a].roas0,v=>nf(v,1)],['CPI ($)',a=>Q[a].cpi,v=>nf(v,3)],['Home rate (%)',a=>Q[a].home,v=>nf(v,1)],['Doanh thu ad first open (sdk_*) ($)',a=>FO[a].earn,v=>nf(v,1)],['% doanh thu từ first open',a=>FO[a].earn/T[a].earn*100,v=>nf(v,1)]];
    cols=[['k','Chỉ số',1],['D','DreamShot'],['R','Renix AI'],['x','Dream / Renix']];
    rows=m.map(([l,fn,fm])=>({k:l,D:fm(fn('Dream')),R:fm(fn('Renix')),x:fn('Renix')?nf(fn('Dream')/fn('Renix'),2)+'×':'—',_s:{}}));
    note='Số liệu cộng dồn toàn bộ ad unit & nguồn trong file.';
  }else if(view==='unit'){
    cols=[['unit','Ad unit',1],['fmt','Format',1],['dE','Dream $'],['dI','Dream imp'],['dC','Dream eCPM'],['dX','Dream eCPM (bỏ WF)'],['dW','WF % doanh thu'],['rE','Renix $'],['rI','Renix imp'],['rC','Renix eCPM'],['ratio','eCPM Dream/Renix']];
    rows=units.filter(u=>pass({unit:u,fmt:ROWS.find(r=>r.unit===u).fmt})).map(u=>{const a=U('Dream',u),ax=U('Dream',u,false),b=U('Renix',u);
      return {unit:u,fmt:ROWS.find(r=>r.unit===u).fmt,dE:a.earn,dI:a.imp,dC:a.ecpm,dX:ax.ecpm,dW:a.earn?(1-ax.earn/a.earn)*100:0,rE:b.earn,rI:b.imp,rC:b.ecpm,ratio:b.ecpm&&a.ecpm?a.ecpm/b.ecpm:0}});
    sortK=sortK||'dE';
    note=`${rows.length} ad unit. eCPM chỉ có ý nghĩa khi có đủ impression (nhỏ hơn ~50 imp thì nhiễu).`;
  }else if(view==='src'){
    cols=[['src','Nguồn',1],['app','App',1],['earn','Doanh thu $'],['imp','Imp'],['ecpm','eCPM'],['req','Requests'],['mreq','Matched'],['match','Match %'],['fill','Imp/req %']];
    const keys=[];ROWS.filter(pass).forEach(r=>{const k=r.app+'|'+r.src;if(!keys.includes(k))keys.push(k)});
    rows=keys.map(k=>{const [a,s]=k.split('|');const x=agg(ROWS.filter(r=>r.app===a&&r.src===s&&pass(r)));return {src:s,app:a,...x}});
    sortK=sortK||'earn';
  }else{
    cols=[['app','App',1],['unit','Ad unit',1],['src','Nguồn',1],['earn','Doanh thu $'],['ecpm','eCPM'],['req','Requests'],['match','Match %'],['show','Show %'],['imp','Imp'],['ctr','CTR %'],['clk','Clicks'],['lat','Latency s'],['bidreq','Bid req'],['inauc','Bids in auction %'],['win','Win %']];
    rows=ROWS.filter(pass).filter(r=>r.req>0||r.imp>0);
    sortK=sortK||'earn';
  }
  if(sortK){rows=rows.slice().sort((a,b)=>{const x=a[sortK],y=b[sortK];return (typeof x==='string'?x.localeCompare(y):(x-y))*sortDir})}
  const head='<tr>'+cols.map(([k,l,left])=>`<th class="${left?'l':''} ${view==='summary'?'nosort':''}" ${view==='summary'?'':`onclick="sortBy('${k}')"`}>${l}${sortK===k?(sortDir<0?' ↓':' ↑'):''}</th>`).join('')+'</tr>';
  const fmtc=(k,v)=>{if(typeof v==='string')return v;if(v===undefined||v===null)return '';
    if(['earn','dE','rE'].includes(k))return nf(v,2);if(['ecpm','dC','dX','rC','ratio','lat'].includes(k))return nf(v,2);if(['match','fill','show','ctr','inauc','win','dW'].includes(k))return nf(v,1);return nf(v,0)};
  const body=rows.map(r=>`<tr>`+cols.map(([k,,left])=>{let v=r[k];if(view==='raw'&&k==='unit')v=v;return td(fmtc(k,v),left?'l':'')}).join('')+`</tr>`).join('');
  $('#dt').innerHTML=head+body;
  $('#dtnote').textContent=note+(view==='raw'?` Hiển thị ${rows.length} dòng (đã ẩn dòng placeholder không có request/impression).`:'');
}
function sortBy(k){if(sortK===k)sortDir*=-1;else{sortK=k;sortDir=-1}renderTable()}

// ---------- nav ----------
function go(w){document.querySelectorAll('.view').forEach(v=>v.classList.remove('on'));$('#'+w).classList.add('on');
